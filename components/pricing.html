<section id="pricing" class="container my-5">
  <div class="text-center mb-4">
    <h3 class="fw-semibold text-green">Solcrest Pricing</h3>
    <div
      class="mx-auto mt-2"
      style="width: 60px; height: 2px; background: var(--green)"
    ></div>
  </div>

  <div class="pricing-box overflow-hidden">
    <!-- Header -->
    <div class="row g-0 pricing-head text-white fw-semibold">
      <div class="col-md-3">Type</div>
      <div class="col-md-3">Area</div>
      <div class="col-md-3">Price (Onwards)</div>
      <div class="col-md-3 text-center"></div>
    </div>

    <!-- Row 1 -->
    <div class="row g-0 pricing-row align-items-center">
      <div class="col-md-3">2 BHK</div>
      <div class="col-md-3">1332-1347 Sq.ft.</div>
      <div class="col-md-3">₹ 1.46 Cr* Onwards</div>
      <div class="col-md-3 text-center">
        <a
          href="#"
          class="btn btn-outline-light orbit-btn"
          data-bs-toggle="modal"
          data-bs-target="#leadModal"
        >
          Complete Costing Details
        </a>
      </div>
    </div>

    <!-- Additional unit example -->
    <div class="row g-0 pricing-row align-items-center">
      <div class="col-md-3">3 BHK</div>
      <div class="col-md-3">1516-2062 Sq.ft.</div>
      <div class="col-md-3">₹ On Request</div>
      <div class="col-md-3 text-center">
        <a
          href="#"
          class="btn btn-outline-light orbit-btn"
          data-bs-toggle="modal"
          data-bs-target="#leadModal"
        >
          Complete Costing Details
        </a>
      </div>
    </div>

    <!-- Additional unit example -->
    <div class="row g-0 pricing-row align-items-center">
      <div class="col-md-3">4 BHK</div>
      <div class="col-md-3">2164 Sq.ft.</div>
      <div class="col-md-3">₹ On Request</div>
      <div class="col-md-3 text-center">
        <a
          href="#"
          class="btn btn-outline-light orbit-btn"
          data-bs-toggle="modal"
          data-bs-target="#leadModal"
        >
          Complete Costing Details
        </a>
      </div>
    </div>
  </div>
  <style>
    .pricing-box {
      border-radius: 24px;
      background: var(--green);
      color: #fff;
    }

    .pricing-head {
      background: linear-gradient(
        90deg,
        var(--brand-purple),
        var(--birla-blue),
        var(--brand-purple)
      );

      background-size: 300% 100%;
      animation: waveMix 2s ease-in-out infinite;

      padding: 16px 20px;
      font-size: 15px;
    }

    .pricing-row {
      background: #f6f3ee;
      color: #000;
      padding: 16px 20px;
      border-top: 1px solid rgba(0, 0, 0, 0.05);
    }

    .pricing-row:first-of-type {
      border-top: none;
    }

    /*.pricing-btn {*/
    /*  border-radius: 14px;*/
    /*  border: 2px solid var(--gold);*/
    /*  color: #fff;*/
    /*  background: var(--green);*/
    /*  padding: 6px 16px;*/
    /*  font-size: 14px;*/
    /*}*/

    /*.pricing-btn:hover {*/
    /*  background: var(--gold);*/
    /*  color: #000;*/
    /*  border-color: var(--gold);*/
    /*}*/

    /* Mobile */
    @media (max-width: 768px) {
      .pricing-head {
        display: none;
      }

      .pricing-row {
        text-align: center;
        gap: 10px;
      }

      .pricing-row > div {
        margin-bottom: 8px;
      }
    }
  </style>
</section>
