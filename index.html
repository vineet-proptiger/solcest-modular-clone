      @keyframes ballBounce {
        0% {
          transform: translateY(-4px);
          animation-timing-function: ease-out;
        }
        40% {
          transform: translateY(4px);
          animation-timing-function: ease-in;
        }
        55% {
          transform: translateY(0px);
          animation-timing-function: ease-out;
        }
        70% {
          transform: translateY(2px);
          animation-timing-function: ease-in;
        }
        85% {
          transform: translateY(1px);
          animation-timing-function: ease-out;

        100% {

    <style>
      /* COMMON OVERLAY */
      .plan-card::after {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        z-index: 1;
        /*pointer-events: none; */
      }

      /* DEFAULT CENTER TEXT */
      .plan-overlay-text {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        font-weight: 600;
        color: #fff;
        z-index: 2;
        transition: opacity 0.3s ease;
        text-align: center;
        padding: 0 20px;
        align-self: center;
        background-color: #00000063;
        height: 50px;
      }

      .plan-card {
        position: relative;
        overflow: hidden;
        border-radius: 8px;
        cursor: pointer;
      }

      .plan-card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.4s ease;
      }

      .plan-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transform: translateY(-20px);
        transition: all 0.4s ease;
        z-index: 3; /* 🔑 above overlay */
        /*pointer-events: none; */
      }

      .plan-card:hover .plan-overlay {
        opacity: 1;
        transform: translateY(0);
        /*pointer-events: none;*/
      }

      .plan-btn {
        position: relative;
        z-index: 4; /* 🔑 highest */
        transform: translateY(-20px);
        transition: all 0.4s ease;
      }

      /* Hover Effects */
      .plan-card:hover img {
        transform: scale(1.05);
      }

      .plan-card:hover .plan-overlay-text {
        opacity: 0;
      }

      .plan-card:hover .plan-btn {
        transform: translateY(0);
        z-index: 9999;
      }
    </style>
    <style>
      .amenities-section {
        background: #f4efec;
      }

      /* Horizontal scroll */
      .amenities-scroll {
        display: flex;
        gap: 18px;
        overflow-x: auto;
        scroll-behavior: smooth;
        padding: 10px 0px;
      }

      /* Hide scrollbar */
      .amenities-scroll::-webkit-scrollbar {
        display: none;
      }

      /* One column = 2 rows */
      .amenity-col {
        display: flex;
        flex-direction: column;
        gap: 18px;
        min-width: 260px;
      }

      /* Card */
      .amenity-card {
        position: relative;
        height: 180px;
        overflow: hidden;
        border-radius: 4px;
        cursor: pointer;
      }

      .amenity-card img {
        width: 100%;
        height: 100%;
        object-fit: cover bottom center;
        transition: transform 0.5s ease;
      }
      .amenity-card:hover img {
        transform: scale(1.08);
      }
      .amenity-card::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to top,
          rgba(0, 0, 0, 0.65),
          rgba(0, 0, 0, 0.15),
          rgba(0, 0, 0, 0)
        );
        opacity: 0;
        transition: opacity 0.4s ease;
        pointer-events: none;
      }
      .amenity-card:hover::after {
        opacity: 1;
      }
      /* Label */
      .amenity-card span {
        position: absolute;
        bottom: 10px;
        left: 10px;
        background: rgba(0, 0, 0, 0.65);
        color: #fff;
        font-size: 12px;
        font-weight: 600;
        padding: 4px 10px;
        letter-spacing: 0.5px;
        transition: all 0.35s ease;
      }
      .amenity-card:hover span {
        background: var(--green);
        transform: translateY(-4px);
      }
      /* Arrows */
      .amenity-arrow {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: #fff;
        border: none;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
        z-index: 5;
      }

      .amenity-arrow.left {
        left: 0;
      }
      .amenity-arrow.right {
        right: 0;
      }

      .amenity-arrow i {
        color: #000;
      }
      .lightbox img {
        pointer-events: none;
      }
    </style>

      overflow: hidden;
      background: #fff;
      }

      .partners-item img {
      width: 100%;
      height: auto;        /* KEY FIX */
      aspect-ratio: 1/1;   /* keeps square */
      object-fit: contain; /* SHOW FULL IMAGE */
      background: #fff;
      }
    </style>
    <style>
      

      /* Track */
      .gallery-track {
        display: flex;
        gap: 18px;
        overflow-x: auto;
        scroll-behavior: smooth;
        padding: 10px 5px;
      }

      .gallery-track::-webkit-scrollbar {
        display: none;
      }

      /* Item */
      .gallery-item {
        min-width: 260px;
        position: relative;
        overflow: hidden;
        border-radius: 6px;
        cursor: pointer;
      }

      .gallery-item img {
        width: 100%;
        height: 170px;
        object-fit: cover;
        transition: transform 0.4s ease;
      }

      /* Hover zoom */
      .gallery-item:hover img {
        transform: scale(1.07);
      }

      /* Label */
      .gallery-item span {
        position: absolute;
        bottom: 10px;
        left: 10px;
        background: #5a5a5a38;
        color: #fff;
        font-size: 8px;
        padding: 4px 10px;
        border-radius: 20px;
      }

      /* Arrows */
      .gallery-arrow {
        position: absolute;
        bottom: -62px;
        left: 50%;
        transform: translateX(-50%);
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: none;
        background: #fff;
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.25);
        z-index: 3;
        cursor: pointer;
      }

      .gallery-arrow.left {
        margin-left: -30px;
      }

      .gallery-arrow.right {
        margin-left: 30px;
      }

      .gallery-arrow i {
        font-size: 16px;
      }

      /* Lightbox */
      .lightbox {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.85);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 5000;
      }

      .lightbox img {
        max-width: 90%;
        max-height: 90%;
        border-radius: 8px;
        pointer-events: none; /* IMPORTANT */
      }

      .lightbox-close {
        position: absolute;
        top: 30px;
        right: 40px;
        font-size: 36px;
        color: #fff;
        cursor: pointer;
        z-index: 4000;
      }

      /* Mobile */
      @media (max-width: 768px) {
        .gallery-track {
          padding: 10px 0px;
        }
      }
    </style>
